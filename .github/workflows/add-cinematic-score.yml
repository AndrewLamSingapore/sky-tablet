name: Sky Tablet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify experience assets
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('index.html'),
              Path('experience.html'),
              Path('cinematic-score.js'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required assets: {', '.join(missing)}")

          index = Path('index.html').read_text(encoding='utf-8')
          score = Path('cinematic-score.js').read_text(encoding='utf-8')
          if 'cinematic-score.js' not in index:
              raise SystemExit('index.html does not load cinematic-score.js')
          if 'SkyTabletScore' not in index or 'SkyTabletScore' not in score:
              raise SystemExit('cinematic score controls are not wired')

          conflict_markers = ('<<<<<<<', '=======', '>>>>>>>')
          for path in required:
              text = path.read_text(encoding='utf-8')
              if any(marker in text for marker in conflict_markers):
                  raise SystemExit(f'Unresolved merge marker in {path}')
          PY
