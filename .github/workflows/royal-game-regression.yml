name: Royal Game of Ur browser regression
on:
  push:
    branches: [main]
    paths:
      - 'royal-game-of-ur.html'
      - 'experience.html'
      - 'tests/royal-game.spec.cjs'
      - '.github/workflows/royal-game-regression.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Start local static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Run desktop and mobile browser regression
        run: npx playwright test tests/royal-game.spec.cjs --reporter=line --workers=1 --config=playwright.config.cjs
